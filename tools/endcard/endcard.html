<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts/opensans.css">
<style>
  html,body{margin:0;width:1080px;height:1920px;background:#ffffff;overflow:hidden;font-family:'Open Sans',sans-serif;-webkit-font-smoothing:antialiased}
  #stage{position:relative;width:1080px;height:1920px;background:#fff}
  svg#border{position:absolute;left:0;top:0}
  #logo{position:absolute;left:180px;top:715px;width:720px;height:258px;transform-origin:50% 50%}
  #slogan{position:absolute;left:0;width:1080px;top:1000px;text-align:center;font-weight:700;font-size:46px;letter-spacing:1.5px;color:#111}
  #addr{position:absolute;left:0;width:1080px;top:1265px;text-align:center;font-weight:600;font-size:66px;color:#111;white-space:nowrap}
  #raud{display:inline-block;transform-origin:50% 60%;color:#111}
</style></head>
<body><div id="stage">
  <svg id="border" width="1080" height="1920" viewBox="0 0 1080 1920">
    <rect id="rect" x="47" y="47" width="986" height="1826" fill="none" stroke="#e40213" stroke-width="14"/>
  </svg>
  <img id="logo" src="logo.png">
  <div id="slogan">ALVÖRU VERKFÆRI, RÉTT VERÐ</div>
  <div id="addr">Smiðjuvegur 36 &#8211; <span id="raud">Rauð gata</span></div>
</div>
<script>
  const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
  const easeOut=t=>1-Math.pow(1-t,3);
  const easeInOut=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
  const seg=(t,a,b)=>clamp((t-a)/(b-a),0,1);
  const rect=document.getElementById('rect');
  const L=2*(986+1826); rect.setAttribute('stroke-dasharray',L);
  const logo=document.getElementById('logo'), slogan=document.getElementById('slogan'), addr=document.getElementById('addr'), raud=document.getElementById('raud');
  function hex(a,b,k){const p=s=>[1,3,5].map(i=>parseInt(s.substr(i,2),16));const A=p(a),B=p(b);return '#'+A.map((v,i)=>Math.round(v+(B[i]-v)*k).toString(16).padStart(2,'0')).join('')}
  window.render=function(t){
    // border draws 0.00-0.60
    rect.setAttribute('stroke-dashoffset', L*(1-easeInOut(seg(t,0.0,0.6))));
    // logo 0.30-0.85: scale .92->1, opacity 0->1
    const kl=easeOut(seg(t,0.30,0.85)); logo.style.opacity=kl; logo.style.transform=`scale(${0.92+0.08*kl})`;
    // slogan 0.75-1.15
    const ks=easeOut(seg(t,0.75,1.15)); slogan.style.opacity=ks; slogan.style.transform=`translateY(${(1-ks)*14}px)`;
    // address 1.05-1.45 (black)
    const ka=easeOut(seg(t,1.05,1.45)); addr.style.opacity=ka; addr.style.transform=`translateY(${(1-ka)*14}px)`;
    // Rauð gata turns red 1.30-1.55 with a pulse
    const kr=seg(t,1.30,1.55); raud.style.color=hex('#111111','#e40213',easeOut(kr));
    const pulse=Math.sin(Math.PI*kr)*0.07; raud.style.transform=`scale(${1+pulse})`;
  };
  window.render(0);
</script></body></html>
